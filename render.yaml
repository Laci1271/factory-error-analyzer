services:
  - type: web
    name: factory-error-analyzer
    runtime: node
    plan: free

    buildCommand: cd client && npm install && npm run build
    startCommand: cd server && npm install && npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

    autoDeployTrigger: off
