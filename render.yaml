services:
  - type: web
    name: factory-error-analyzer
    env: node
    plan: free
    buildCommand: "cd client && npm install && npm run build"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    autoDeploy: false